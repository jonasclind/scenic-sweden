<!doctype html>
<meta charset="utf-8">
<title>Scenic View Finder — Alingsås</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<style>
  :root{
    --ink:#1a1a1a; --ink-2:#5a5a5a; --ink-3:#8a8a8a;
    --surface:#fbfaf8; --line:#e2ddd5; --accent:#9C4A07;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0}
  .panel{
    position:absolute;top:12px;left:12px;z-index:2;width:250px;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 2px 12px rgba(0,0,0,.14);overflow:hidden;
  }
  .panel h1{margin:0;padding:11px 13px 9px;font-size:13px;font-weight:600;
    border-bottom:1px solid var(--line);letter-spacing:.01em}
  .panel h1 span{display:block;font-weight:400;font-size:11px;color:var(--ink-3);margin-top:2px}
  .grp{padding:11px 13px;border-bottom:1px solid var(--line)}
  .grp:last-child{border-bottom:0}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:6px}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{flex:1;padding:6px 4px;border:0;background:#fff;font:inherit;font-size:12px;
    color:var(--ink-2);cursor:pointer;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:500}
  label.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:12px}
  label.chk input{margin:2px 0 0}
  label.chk em{display:block;font-style:normal;color:var(--ink-3);font-size:11px;line-height:1.4}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .ramp{height:9px;border-radius:2px;margin:2px 0 4px}
  .ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .stat{font-size:11px;color:var(--ink-2);margin-top:7px;font-variant-numeric:tabular-nums}
  .maplibregl-popup-content{font:12px/1.5 -apple-system,sans-serif;padding:9px 11px;border-radius:6px}
  .maplibregl-popup-content b{font-size:12px}
  .maplibregl-popup-content a{color:var(--accent)}
  .spot{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;
    border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);font-size:10px;font-weight:600;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>

<div id="map"></div>
<div class="panel">
  <h1>Scenic View Finder<span>Alingsås · 50 km · views to 20 km</span></h1>

  <div class="grp">
    <div class="lbl">Basemap</div>
    <div class="seg" id="base">
      <button data-v="sat" aria-pressed="true">Satellite</button>
      <button data-v="osm" aria-pressed="false">Map</button>
    </div>
  </div>

  <div class="grp">
    <div class="lbl">Show</div>
    <div class="seg" id="view">
      <button data-v="openness" aria-pressed="true">How far you see</button>
      <button data-v="water" aria-pressed="false">Sees water</button>
    </div>
  </div>

  <div class="grp">
    <label class="chk">
      <input type="checkbox" id="bare">
      <span>Remove forest
        <em>Views as if clear-felled. Off = today's canopy, 20 m over ESA WorldCover tree cover.</em>
      </span>
    </label>
    <div class="stat" id="stat"></div>
  </div>

  <div class="grp">
    <div class="lbl">How far you can see</div>
    <div class="ramp" id="ramp"></div>
    <div class="ticks"><span>0</span><span>2</span><span>4</span><span>6</span><span>8+ km</span></div>
  </div>

  <div class="grp">
    <div class="lbl">Overlay opacity</div>
    <input type="range" id="op" min="0" max="100" value="85">
  </div>
</div>

<script>
const state = { base:'sat', view:'openness', bare:false };

fetch('data.json').then(r=>r.json()).then(init);

function init(data){
  document.getElementById('ramp').style.background =
    `linear-gradient(90deg, ${data.ramp.join(',')})`;

  const sources = {
    sat:{type:'raster',tileSize:256,
      tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'},
    osm:{type:'raster',tileSize:256,
      tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
      attribution:'&copy; OpenStreetMap contributors'}
  };
  const layers = [
    {id:'base-sat',type:'raster',source:'sat'},
    {id:'base-osm',type:'raster',source:'osm',layout:{visibility:'none'}}
  ];

  for(const l of data.layers){
    const id = `${l.view}_${l.vegetation}`;
    const [w,s,e,n] = l.bounds;
    sources[id] = {type:'image', url:l.file,
      coordinates:[[w,n],[e,n],[e,s],[w,s]]};
    layers.push({id:'ov-'+id, type:'raster', source:id,
      paint:{'raster-opacity':0.85,'raster-fade-duration':0},
      layout:{visibility:'none'}});
  }

  const map = new maplibregl.Map({
    container:'map', style:{version:8, sources, layers},
    center:[data.centre[1], data.centre[0]], zoom:9.6, attributionControl:{compact:false}
  });
  window.map = map;   // handy for debugging from the console
  map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
  map.addControl(new maplibregl.ScaleControl({maxWidth:120}), 'bottom-left');

  let markers = [];
  const key = () => `${state.view}_${state.bare?'bare':'trees'}`;

  function render(){
    for(const l of data.layers)
      map.setLayoutProperty(`ov-${l.view}_${l.vegetation}`,'visibility','none');
    map.setLayoutProperty('ov-'+key(),'visibility','visible');
    map.setLayoutProperty('base-sat','visibility', state.base==='sat'?'visible':'none');
    map.setLayoutProperty('base-osm','visibility', state.base==='osm'?'visible':'none');

    const l = data.layers.find(x=>`${x.view}_${x.vegetation}`===key());
    document.getElementById('stat').textContent =
      `${l.cells.toLocaleString()} places qualify · median ${l.median_km.toFixed(1)} km`;

    markers.forEach(m=>m.remove()); markers = [];
    l.spots.forEach((sp,i)=>{
      const el = document.createElement('div');
      el.className='spot'; el.textContent = i+1;
      const pop = new maplibregl.Popup({offset:14}).setHTML(
        `<b>#${i+1} — ${(sp.score/1000).toFixed(1)} km view</b><br>`+
        `${sp.ground.toFixed(0)} m elevation<br>`+
        `best ${(sp.best_km).toFixed(1)} km at ${sp.best_dir.toFixed(0)}°<br>`+
        (sp.water_km>0?`water ${sp.water_km.toFixed(1)} km away<br>`:'no water visible<br>')+
        `<a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${sp.lat.toFixed(5)},${sp.lon.toFixed(5)}">open in Google Maps</a>`);
      markers.push(new maplibregl.Marker({element:el}).setLngLat([sp.lon,sp.lat])
        .setPopup(pop).addTo(map));
    });
  }

  map.on('load', render);

  for(const grp of ['base','view'])
    document.getElementById(grp).addEventListener('click', ev=>{
      const b = ev.target.closest('button'); if(!b) return;
      state[grp] = b.dataset.v;
      [...ev.currentTarget.children].forEach(c=>
        c.setAttribute('aria-pressed', String(c===b)));
      render();
    });

  document.getElementById('bare').addEventListener('change', e=>{
    state.bare = e.target.checked; render();
  });

  document.getElementById('op').addEventListener('input', e=>{
    map.setPaintProperty('ov-'+key(),'raster-opacity', e.target.value/100);
  });

  map.on('click', e=>{
    if(e.originalEvent.target.closest('.spot')) return;
    const {lat,lng} = e.lngLat;
    new maplibregl.Popup().setLngLat(e.lngLat).setHTML(
      `${lat.toFixed(5)}, ${lng.toFixed(5)}<br>`+
      `<a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${lat.toFixed(5)},${lng.toFixed(5)}">open in Google Maps</a>`
    ).addTo(map);
  });
}
</script>
