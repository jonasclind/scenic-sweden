<!doctype html>
<meta charset="utf-8">
<title>Scenic View Finder — Alingsås</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<style>
  :root{--ink:#1a1a1a;--ink-2:#5a5a5a;--ink-3:#8a8a8a;
        --surface:#fbfaf8;--line:#e2ddd5;--accent:#9C4A07;--bar:50px}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
  /* Fixed, not absolute: on a phone the browser's toolbars slide in and out,
     and only fixed positioning tracks the viewport they leave behind. */
  #map{position:fixed;inset:0}
  #ovcanvas{display:none}
  .panel{position:fixed;top:12px;left:12px;z-index:2;width:236px;background:var(--surface);
    border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 14px rgba(0,0,0,.15);
    overflow:hidden;max-height:calc(100% - 24px);overflow-y:auto}
  .panel h1{margin:0;padding:9px 12px 8px;font-size:13px;font-weight:600;
    border-bottom:1px solid var(--line);letter-spacing:.01em;
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .panel h1 .sub{display:block;font-weight:400;font-size:10.5px;color:var(--ink-3);
    margin-top:2px;line-height:1.35}
  .chev{display:none;flex:0 0 auto;width:10px;height:10px;margin:5px 2px 0 0;
    border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);
    transform:rotate(-135deg);transition:transform .18s}
  .panel[data-open="false"] .chev{transform:rotate(45deg);margin-top:0}
  .grp{padding:9px 12px;border-bottom:1px solid var(--line)}
  .grp:last-child{border-bottom:0}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:6px}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{flex:1;padding:6px 4px;border:0;background:#fff;font:inherit;font-size:12px;
    color:var(--ink-2);cursor:pointer;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:500}
  .eyeseg button{padding:5px 2px;line-height:1.25}
  .eyeseg em{display:block;font-style:normal;font-size:10px;opacity:.65}
  #hover{position:fixed;top:12px;right:12px;z-index:3;background:var(--surface);
    border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:11px;
    color:var(--ink);font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  #busy{position:fixed;top:12px;left:276px;z-index:3;background:var(--surface);
    border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:11px;
    color:var(--ink-2);box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .wheelrow{display:flex;align-items:center;gap:8px}
  #wheel{display:block;width:134px;height:134px;flex:0 0 134px;touch-action:none;user-select:none}
  #presets{display:flex;flex-direction:column;gap:3px;flex:1 1 auto}
  #presets button{padding:3px 6px;font:inherit;font-size:11px;background:#fff;
    border:1px solid var(--line);border-radius:5px;color:var(--ink-2);cursor:pointer}
  #presets button:hover{border-color:var(--accent);color:var(--accent)}
  .checks label{display:flex;gap:7px;align-items:center;cursor:pointer;font-size:12px;
    padding:2px 0}
  .checks input[type=checkbox]{margin:0;accent-color:var(--accent)}
  .sunrow{display:flex;gap:5px;margin-top:8px}
  .sunrow input{flex:1;min-width:0;font:inherit;font-size:11.5px;padding:3px 5px;
    border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}
  .sunfoot{display:flex;gap:8px;align-items:center;margin-top:7px}
  .sunfoot button{font:inherit;font-size:11px;padding:3px 9px;background:#fff;
    border:1px solid var(--line);border-radius:5px;color:var(--ink-2);cursor:pointer;
    flex:0 0 auto}
  .sunfoot button:hover{border-color:var(--accent);color:var(--accent)}
  #sunv{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  #sunv .dim{color:var(--ink-3)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .rowlbl{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;
    color:var(--ink-3);font-variant-numeric:tabular-nums}
  .rsval{font-size:11px;color:var(--ink-2);font-weight:500}
  .rs{position:relative;height:22px;margin:3px 0 0;touch-action:none;user-select:none}
  .rs .track{position:absolute;top:7px;left:0;right:0;height:9px;border-radius:2px;
    background:#ece7df;overflow:hidden}
  .rs .fill{position:absolute;top:0;bottom:0;border-radius:2px}
  .rs .knob{position:absolute;top:3px;width:17px;height:17px;margin-left:-8.5px;border-radius:50%;
    background:#fff;border:2.5px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.25);
    cursor:grab}
  .rs .knob:active{cursor:grabbing}
  .ticks{position:relative;height:13px;font-size:10px;color:var(--ink-3);
    font-variant-numeric:tabular-nums}
  .ticks span{position:absolute;transform:translateX(-50%)}
  /* Always visible, collapsed sheet included: it is the readout that says the
     filters did something. */
  #stat{padding:6px 12px;border-bottom:1px solid var(--line);font-size:11px;
    color:var(--ink-2);font-variant-numeric:tabular-nums}
  #stat .dim{color:var(--ink-3)}
  .maplibregl-popup-content{font:12px/1.5 -apple-system,sans-serif;padding:9px 11px;border-radius:6px}
  .maplibregl-popup-content a{color:var(--accent)}
  .spot{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.4);font-size:10px;font-weight:600;display:flex;
    align-items:center;justify-content:center;cursor:pointer}

  /* ------------------------------------------------------ phone: bottom sheet
     A 236 px panel pinned top-left eats a third of a phone screen and leaves
     the map peering out from behind it. Below 720 px it becomes a sheet on the
     bottom edge that collapses to its title bar, and the controls grow to
     finger size. */
  @media (max-width:720px){
    .panel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:none;
      overflow:visible;border-radius:13px 13px 0 0;border-bottom:0;
      padding-bottom:env(safe-area-inset-bottom,0px);
      box-shadow:0 -3px 20px rgba(0,0,0,.22)}
    .panel h1{padding:13px 15px;font-size:14px;cursor:pointer;
      -webkit-tap-highlight-color:transparent}
    .panel h1 .sub{display:none}      /* the region name is desktop chrome */
    .chev{display:block}
    /* The bar and the readout sit outside the scroller, so this is not the
       whole sheet: 44vh plus those leaves a bit over half the screen as map. */
    #sheet{max-height:44vh;overflow-y:auto;overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch}
    .panel[data-open="false"] #sheet{display:none}
    #stat{padding:7px 15px}
    #hover{top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:auto}
    #busy{top:calc(10px + env(safe-area-inset-top,0px));left:auto;right:10px}
    .grp{padding:11px 15px}
    /* Stacked, the five presets are taller than the wheel and twice its
       width. A row underneath gives each a wider target in less space. */
    .wheelrow{flex-direction:column-reverse;align-items:center;gap:10px}
    #wheel{width:150px;height:150px;flex:0 0 150px}
    #presets{flex-direction:row;width:100%;gap:6px}
    #presets button{flex:1;padding:9px 0;font-size:12px}
    .seg button{padding:10px 4px;font-size:13px}
    .eyeseg button{padding:8px 2px}
    .checks label{padding:7px 0;font-size:13px;gap:10px}
    .checks input[type=checkbox]{width:18px;height:18px}
    .sunrow input{font-size:13px;padding:7px 6px}
    .sunfoot button{font-size:12px;padding:7px 11px}
    #sunv{font-size:12px}
    .rs{height:32px}
    .rs .track{top:12px}
    .rs .knob{top:5px;width:23px;height:23px;margin-left:-11.5px}
    input[type=range]{height:28px}
    /* Keep the map's own controls and the attribution clear of the collapsed
       bar; the expanded sheet is allowed to cover them. */
    .maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{
      bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px))}
  }
</style>

<div id="map"></div>
<div id="busy" hidden>loading tiles…</div>
<div id="hover" hidden></div>
<canvas id="ovcanvas"></canvas>

<div class="panel" id="panel" data-open="true">
  <h1 id="sheetbar">
    <span>Scenic View Finder<span class="sub">Skåne · Halland · Bohuslän · Västra Götaland</span></span>
    <i class="chev"></i>
  </h1>
  <div id="stat"></div>

  <div id="sheet">
    <div class="grp">
      <div class="wheelrow">
        <div id="presets">
          <button data-v="all">All</button>
          <button data-v="0">N</button>
          <button data-v="90">E</button>
          <button data-v="180">S</button>
          <button data-v="270">W</button>
        </div>
        <svg id="wheel"></svg>
      </div>
    </div>

    <div class="grp checks">
      <label><input type="checkbox" id="water"> View must include lake or sea</label>
      <label><input type="checkbox" id="bare"> Remove trees</label>
      <label><input type="checkbox" id="openonly"> Skip spots in forest</label>
      <label><input type="checkbox" id="contours" checked> Elevation contours</label>
    </div>

    <div class="grp checks">
      <label><input type="checkbox" id="sunon"> Can see the sun</label>
      <div id="sunfields" hidden>
        <div class="sunrow">
          <input type="date" id="sundate">
          <input type="time" id="suntime">
        </div>
        <div class="sunfoot">
          <button id="tosunset" type="button">Sunset</button>
          <span id="sunv"></span>
        </div>
      </div>
    </div>

    <div class="grp">
      <div class="rowlbl">
        <span class="lbl" style="margin:0">Ground falls away</span>
        <span id="slopev"></span>
      </div>
      <input type="range" id="slope" min="0" max="120" step="5" value="0">
    </div>

    <div class="grp">
      <div class="lbl">Eye height</div>
      <div class="seg eyeseg" id="eye"></div>
    </div>

    <div class="grp">
      <div class="rowlbl">
        <span class="lbl" style="margin:0">How far you can see</span>
        <span class="rsval"></span>
      </div>
      <div id="range" class="rs">
        <div class="track"><div class="fill"></div></div>
        <div class="knob" data-k="0"></div>
        <div class="knob" data-k="1"></div>
      </div>
      <div class="ticks" id="ticks"></div>
    </div>

    <div class="grp">
      <div class="seg" id="base">
        <button data-v="sat" aria-pressed="true">Satellite</button>
        <button data-v="osm" aria-pressed="false">Map</button>
      </div>
      <div class="rowlbl" style="margin-top:10px">
        <span class="lbl" style="margin:0">Clarity</span>
        <span id="clarityv"></span>
      </div>
      <input type="range" id="clarity" min="0" max="100" step="1" value="50">
    </div>
  </div>
</div>

<script type="module">
  // Dynamic import with a cache-buster. A browser's module map is separate
  // from its HTTP cache, so a plain src= can keep running a stale module even
  // after a reload - which looks exactly like the edit having had no effect.
  import(`./app.js?t=${Date.now()}`);
</script>
